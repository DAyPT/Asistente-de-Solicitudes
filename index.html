<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; object-src 'none'; frame-ancestors 'none';">
    <title>Asistente de Solicitudes</title>
    <link rel="stylesheet" href="asot.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Ir al contenido principal</a>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>📋 Asistente de Solicitudes</h1>
            </div>
        </header>

        <div class="content">
            <aside class="sidebar" aria-label="Filtros y listado de servicios">
                <div class="modulo-datos">
                    <h3 id="datos-heading">1️⃣ ¿Qué datos tienes?</h3>
                    <div class="datos-checkbox-group" role="group" aria-labelledby="datos-heading">
                        <label class="datos-checkbox-item">
                            <input type="checkbox" class="dato-checkbox" id="dato-telefono" value="telefono">
                            <span class="dato-label">☎️ Número de teléfono</span>
                        </label>
                        <label class="datos-checkbox-item">
                            <input type="checkbox" class="dato-checkbox" id="dato-ip" value="ip">
                            <span class="dato-label">🌐 Dirección IP</span>
                        </label>
                        <label class="datos-checkbox-item">
                            <input type="checkbox" class="dato-checkbox" id="dato-email" value="email">
                            <span class="dato-label">📧 Email</span>
                        </label>
                        <label class="datos-checkbox-item">
                            <input type="checkbox" class="dato-checkbox" id="dato-cuenta_banco" value="cuenta_banco">
                            <span class="dato-label">🏦 Cuenta bancaria / Tarjeta</span>
                        </label>
                        <label class="datos-checkbox-item">
                            <input type="checkbox" class="dato-checkbox" id="dato-usuario_redsocial" value="usuario_redsocial">
                            <span class="dato-label">📱 Usuario red social / Nickname</span>
                        </label>
                        <label class="datos-checkbox-item">
                            <input type="checkbox" class="dato-checkbox" id="dato-vehiculo" value="vehiculo">
                            <span class="dato-label">🚗 Patente vehículo</span>
                        </label>
                    </div>
                </div>

                <div class="paso-intermedio" id="pasoIntermedio" role="region" aria-labelledby="paso-intermedio-title">
                    <h4 id="paso-intermedio-title">2️⃣ Información obtenible</h4>
                    <div id="informacionObtenible" aria-live="polite"></div>
                </div>

                <div class="servicios-recomendados" id="serviciosRecomendados" role="region" aria-labelledby="servicios-rec-title">
                    <h4 id="servicios-rec-title">3️⃣ Servicios a solicitar</h4>
                    <div id="serviciosRecomendadosList" aria-live="polite"></div>
                </div>

                <div class="search-box">
                    <label for="searchInput" class="visually-hidden">Buscar servicio por nombre</label>
                    <input type="search" id="searchInput" placeholder="Buscar servicio..." autocomplete="off">
                </div>

                <div class="category-filter" role="group" aria-labelledby="cat-heading">
                    <h3 id="cat-heading">Categorías</h3>
                    <button type="button" class="category-btn active" data-category="todas" aria-pressed="true">Todas</button>
                    <button type="button" class="category-btn" data-category="telecomunicaciones" aria-pressed="false">Telecomunicaciones</button>
                    <button type="button" class="category-btn" data-category="isp" aria-pressed="false">ISP (Internet)</button>
                    <button type="button" class="category-btn" data-category="plataformas" aria-pressed="false">Plataformas y Redes</button>
                    <button type="button" class="category-btn" data-category="transporte" aria-pressed="false">Transporte</button>
                    <button type="button" class="category-btn" data-category="financiero" aria-pressed="false">Financiero y Bancos</button>
                    <button type="button" class="category-btn" data-category="registros" aria-pressed="false">Registros</button>
                </div>

            </aside>

            <main class="main" id="main-content" tabindex="-1">
                <div class="servicios-list" id="serviciosList" role="group" aria-label="Servicios disponibles"></div>

                <div id="detailPanel" class="detail-panel">
                    <div class="detail-header">
                        <button type="button" class="btn-volver" id="btnVolver">← Volver</button>
                        <h2 id="servicioNombre" tabindex="-1"></h2>
                        <span class="detail-category" id="servicioCategoria"></span>
                    </div>

                    <div class="tab-group" role="tablist" aria-label="Secciones del servicio seleccionado">
                        <button type="button" class="tab-btn active" role="tab" id="tab-informacion" data-tab="informacion" aria-selected="true" aria-controls="informacion" tabindex="0">Información</button>
                        <button type="button" class="tab-btn" role="tab" id="tab-contactos" data-tab="contactos" aria-selected="false" aria-controls="contactos" tabindex="-1">Contactos</button>
                        <button type="button" class="tab-btn" role="tab" id="tab-solicitud" data-tab="solicitud" aria-selected="false" aria-controls="solicitud" tabindex="-1">Solicitud</button>
                    </div>

                    <div id="informacion" class="tab-content active" role="tabpanel" aria-labelledby="tab-informacion" tabindex="0">
                        <div class="section">
                            <h3>¿Qué se puede solicitar?</h3>
                            <div id="queInformacion"></div>
                        </div>
                        <div class="section">
                            <h3>Requisitos Legales</h3>
                            <div id="requisitosLegales"></div>
                        </div>
                        <div class="section">
                            <h3>Procedimiento</h3>
                            <div id="procedimiento"></div>
                        </div>
                        <div class="section">
                            <h3>Tiempo de Respuesta</h3>
                            <div id="tiempoRespuesta" class="info-item"></div>
                        </div>
                        <div class="section">
                            <h3>Notas</h3>
                            <div id="notas"></div>
                        </div>
                    </div>

                    <div id="contactos" class="tab-content" role="tabpanel" aria-labelledby="tab-contactos" tabindex="0" hidden>
                        <div class="section">
                            <h3>Información de Contacto</h3>
                            <div id="contactosList"></div>
                        </div>
                    </div>

                    <div id="solicitud" class="tab-content" role="tabpanel" aria-labelledby="tab-solicitud" tabindex="0" hidden>
                        <button type="button" class="btn btn-primary" id="generarSolicitudBtn">✏️ Crear Nota de Solicitud</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="solicitudModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="solicitudModalTitle" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="solicitudModalTitle">Nota de Solicitud</h2>
                <button type="button" class="close" id="closeSolicitud" aria-label="Cerrar ventana de nota de solicitud">&times;</button>
            </div>

            <form id="solicitudForm">
                <div class="form-group">
                    <label for="formServicio">Servicio</label>
                    <input type="text" id="formServicio" readonly>
                </div>

                <div class="form-group">
                    <label for="formReferencia">Referencia (IPP / Causa)</label>
                    <input type="text" id="formReferencia" placeholder="IPP 11-11-00000-20/00" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="formDatos">Información Solicitada</label>
                    <textarea id="formDatos" placeholder="Especifica qué información necesitas..." autocomplete="off"></textarea>
                </div>

                <div class="form-group">
                    <label for="formJustificacion">Justificación / Carátula</label>
                    <textarea id="formJustificacion" placeholder="Caratulada: '...' con intervención de..." autocomplete="off"></textarea>
                </div>

                <div class="form-group">
                    <label for="formEmail">Email a Enviar</label>
                    <input type="email" id="formEmail" placeholder="Email del servicio">
                </div>

                <div class="form-group">
                    <label for="formNotas">Notas Adicionales</label>
                    <textarea id="formNotas" placeholder="Notas importantes (ej: Conversión GMT-300)..." autocomplete="off"></textarea>
                </div>

                <h3 id="preview-heading" style="margin-top: 20px; margin-bottom: 10px; color: #0d3b5c; font-weight: 700; border-bottom: 2px solid #ff9500; padding-bottom: 8px;">Vista Previa</h3>
                <div class="preview" id="preview" role="region" aria-labelledby="preview-heading"></div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary" id="cancelarSolicitud">Cancelar</button>
                    <button type="submit" class="btn btn-primary">💾 Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="asot-data.js"></script>
    <script>
        const { datosAInformacion, informacionAServicios, servicios } = window.ASOT_DATA;

        const CATEGORY_ICONS = {
            telecomunicaciones: '📞',
            isp: '🌐',
            plataformas: '📱',
            transporte: '🚗',
            financiero: '🏦',
            registros: '📋'
        };

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function esUrlSegura(url) {
            return typeof url === 'string' && /^https?:\/\//i.test(url);
        }

        let estado = {
            servicioActual: null,
            filtroActual: 'todas',
            busquedaActual: '',
            datosSeleccionados: [],
            serviciosRecomendados: []
        };

        const TAB_IDS = ['informacion', 'contactos', 'solicitud'];
        let modalPreviousFocus = null;

        document.querySelectorAll('.dato-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', actualizarFlujo);
        });

        function actualizarFlujo() {
            estado.datosSeleccionados = Array.from(document.querySelectorAll('.dato-checkbox:checked')).map(c => c.value);
            
            if (estado.datosSeleccionados.length === 0) {
                estado.serviciosRecomendados = [];
                document.getElementById('pasoIntermedio').classList.remove('active');
                document.getElementById('serviciosRecomendados').classList.remove('active');
                renderizarServicios();
                return;
            }

            const informacionTot = [];
            estado.datosSeleccionados.forEach(dato => {
                informacionTot.push(...(datosAInformacion[dato] || []));
            });
            const informacionUnica = [...new Set(informacionTot)];

            document.getElementById('pasoIntermedio').classList.add('active');
            document.getElementById('informacionObtenible').innerHTML = informacionUnica
                .map(info => `<span class="informacion-tag">📌 ${escapeHtml(info)}</span>`)
                .join('');

            const serviciosTot = new Set();
            informacionUnica.forEach(info => {
                (informacionAServicios[info] || []).forEach(id => serviciosTot.add(id));
            });
            estado.serviciosRecomendados = Array.from(serviciosTot);

            if (estado.serviciosRecomendados.length === 0) {
                document.getElementById('serviciosRecomendados').classList.remove('active');
            } else {
                document.getElementById('serviciosRecomendados').classList.add('active');
                document.getElementById('serviciosRecomendadosList').innerHTML = estado.serviciosRecomendados
                    .map(id => {
                        const s = servicios[id];
                        if (s) {
                            return `<button type="button" class="servicio-recomendado" data-servicio-id="${escapeHtml(id)}">${escapeHtml(s.nombre)}</button>`;
                        }
                        return '';
                    })
                    .join('');
            }

            renderizarServicios();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            estado.busquedaActual = e.target.value;
            renderizarServicios();
        });

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => {
                    b.classList.remove('active');
                    b.setAttribute('aria-pressed', 'false');
                });
                btn.classList.add('active');
                btn.setAttribute('aria-pressed', 'true');
                estado.filtroActual = btn.dataset.category;
                renderizarServicios();
            });
        });

        function activarTab(tabId, { focusTab = true } = {}) {
            if (!TAB_IDS.includes(tabId)) return;
            TAB_IDS.forEach(id => {
                const panel = document.getElementById(id);
                const tabBtn = document.getElementById(`tab-${id}`);
                const sel = id === tabId;
                panel.hidden = !sel;
                panel.classList.toggle('active', sel);
                if (tabBtn) {
                    tabBtn.setAttribute('aria-selected', sel ? 'true' : 'false');
                    tabBtn.tabIndex = sel ? 0 : -1;
                    tabBtn.classList.toggle('active', sel);
                }
            });
            if (focusTab) {
                document.getElementById(`tab-${tabId}`)?.focus();
            }
        }

        function getFocusableElements(container) {
            return Array.from(container.querySelectorAll(
                'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
            )).filter(el => !el.closest('[aria-hidden="true"]'));
        }

        function onModalKeydown(e) {
            if (e.key === 'Escape') {
                e.preventDefault();
                cerrarModalSolicitud();
                return;
            }
            if (e.key !== 'Tab') return;
            const modal = document.getElementById('solicitudModal');
            const content = modal.querySelector('.modal-content');
            const focusables = getFocusableElements(content);
            if (focusables.length === 0) return;
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (e.shiftKey) {
                if (document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                }
            } else if (document.activeElement === last) {
                e.preventDefault();
                first.focus();
            }
        }

        function abrirModalSolicitud() {
            const modal = document.getElementById('solicitudModal');
            modalPreviousFocus = document.activeElement;
            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            modal.addEventListener('keydown', onModalKeydown);
            requestAnimationFrame(() => {
                const ref = document.getElementById('formReferencia');
                if (ref) ref.focus();
            });
        }

        function cerrarModalSolicitud() {
            const modal = document.getElementById('solicitudModal');
            modal.classList.remove('active');
            modal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
            modal.removeEventListener('keydown', onModalKeydown);
            if (modalPreviousFocus && typeof modalPreviousFocus.focus === 'function') {
                modalPreviousFocus.focus();
            }
            modalPreviousFocus = null;
        }

        function renderizarServicios() {
            const filtrados = Object.values(servicios).filter(s => {
                const matchCat = estado.filtroActual === 'todas' || s.categoria === estado.filtroActual;
                const matchBusq = estado.busquedaActual === '' || s.nombre.toLowerCase().includes(estado.busquedaActual.toLowerCase());
                return matchCat && matchBusq;
            }).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

            const listEl = document.getElementById('serviciosList');
            if (filtrados.length === 0) {
                listEl.innerHTML = '<p class="servicios-vacio" role="status">No hay servicios que coincidan con el filtro actual.</p>';
                return;
            }

            listEl.innerHTML = filtrados.map(s => {
                const esRecomendado = estado.serviciosRecomendados.includes(s.id);
                const icono = CATEGORY_ICONS[s.categoria] || '📄';
                const clases = `servicio-item${esRecomendado ? ' recomendado' : ''}`;
                const label = `${escapeHtml(s.nombre)}${esRecomendado ? ' (recomendado)' : ''}`;
                const iconoHtml = s.id
                    ? `<img src="icons/${escapeHtml(s.id)}.png" alt="" class="tile-favicon" onerror="this.replaceWith(document.createTextNode('${icono}'))">`
                    : icono;
                return `<button type="button" class="${clases}" data-servicio-id="${escapeHtml(s.id)}" aria-label="${label}"><span class="tile-icon" aria-hidden="true">${iconoHtml}${esRecomendado ? '<span class="tile-star">⭐</span>' : ''}</span><span class="tile-name">${escapeHtml(s.nombre)}</span></button>`;
            }).join('');
        }

        function seleccionarServicio(id) {
            const s = servicios[id];
            if (!s) return;
            estado.servicioActual = s;

            document.getElementById('serviciosList').style.display = 'none';
            document.getElementById('detailPanel').classList.add('active');

            document.getElementById('servicioNombre').textContent = s.nombre;
            document.getElementById('servicioCategoria').textContent = s.categoria.toUpperCase();

            document.getElementById('queInformacion').innerHTML = s.queInformacion.map(i => `<div class="list-item">${escapeHtml(i)}</div>`).join('');
            document.getElementById('requisitosLegales').innerHTML = s.requisitosLegales.map(i => `<div class="list-item">${escapeHtml(i)}</div>`).join('');
            document.getElementById('procedimiento').innerHTML = `<div class="info-item">${escapeHtml(s.procedimiento)}</div>`;
            document.getElementById('tiempoRespuesta').textContent = s.tiempoRespuesta;
            document.getElementById('notas').innerHTML = `<div class="info-item">${escapeHtml(s.notas)}</div>`;

            document.getElementById('contactosList').innerHTML = s.contactos.map(c => `
                <div class="contact-item">
                    <strong>${escapeHtml(c.nombre)}</strong>
                    ${c.url && esUrlSegura(c.url) ? `<div class="contact-detail">🌐 <a href="${escapeHtml(c.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(c.url)}</a></div>` : ''}
                    ${c.email ? `<div class="contact-detail">📧 <a href="mailto:${escapeHtml(c.email)}">${escapeHtml(c.email)}</a></div>` : ''}
                    ${c.telefono ? `<div class="contact-detail">📞 ${escapeHtml(c.telefono)}</div>` : ''}
                </div>
            `).join('');

            activarTab('informacion', { focusTab: false });
            requestAnimationFrame(() => {
                document.getElementById('servicioNombre').focus();
            });
        }

        document.getElementById('serviciosList').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-servicio-id]');
            if (btn && e.currentTarget.contains(btn)) {
                seleccionarServicio(btn.getAttribute('data-servicio-id'));
            }
        });

        document.getElementById('serviciosRecomendadosList').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-servicio-id]');
            if (btn) {
                seleccionarServicio(btn.getAttribute('data-servicio-id'));
            }
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activarTab(btn.dataset.tab, { focusTab: true });
            });
        });

        document.querySelector('.tab-group').addEventListener('keydown', (e) => {
            const keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];
            if (!keys.includes(e.key)) return;
            const currentIdx = TAB_IDS.findIndex(id =>
                document.getElementById(`tab-${id}`)?.getAttribute('aria-selected') === 'true'
            );
            if (currentIdx < 0) return;
            e.preventDefault();
            let next = currentIdx;
            if (e.key === 'ArrowRight') next = (currentIdx + 1) % TAB_IDS.length;
            else if (e.key === 'ArrowLeft') next = (currentIdx - 1 + TAB_IDS.length) % TAB_IDS.length;
            else if (e.key === 'Home') next = 0;
            else if (e.key === 'End') next = TAB_IDS.length - 1;
            activarTab(TAB_IDS[next], { focusTab: true });
        });

        document.getElementById('generarSolicitudBtn').addEventListener('click', () => {
            const s = estado.servicioActual;
            document.getElementById('formServicio').value = s.nombre;
            document.getElementById('formEmail').value = s.contactos[0]?.email || '';
            actualizarPreview();
            abrirModalSolicitud();
        });

        document.getElementById('closeSolicitud').addEventListener('click', cerrarModalSolicitud);

        document.getElementById('solicitudModal').addEventListener('click', (e) => {
            if (e.target.id === 'solicitudModal') {
                cerrarModalSolicitud();
            }
        });

        document.getElementById('cancelarSolicitud').addEventListener('click', cerrarModalSolicitud);

        document.getElementById('btnVolver').addEventListener('click', () => {
            document.getElementById('detailPanel').classList.remove('active');
            document.getElementById('serviciosList').style.display = '';
            estado.servicioActual = null;
        });

        function generarNota() {
            const fecha = new Date().toLocaleDateString('es-AR');
            return `NOTA DE SOLICITUD
════════════════════════════════════════════
SERVICIO: ${document.getElementById('formServicio').value}
FECHA: ${fecha}
REFERENCIA: ${document.getElementById('formReferencia').value || '---'}

INFORMACIÓN SOLICITADA:
${document.getElementById('formDatos').value || '(sin especificar)'}

JUSTIFICACIÓN:
${document.getElementById('formJustificacion').value || '(sin especificar)'}

NOTAS:
${document.getElementById('formNotas').value || '(sin notas)'}
════════════════════════════════════════════`;
        }

        function actualizarPreview() {
            document.getElementById('preview').textContent = generarNota();
        }

        ['formServicio', 'formReferencia', 'formDatos', 'formJustificacion', 'formEmail', 'formNotas'].forEach(id => {
            document.getElementById(id).addEventListener('input', actualizarPreview);
        });

        document.getElementById('solicitudForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('✅ Solicitud guardada correctamente');
            document.getElementById('solicitudForm').reset();
            cerrarModalSolicitud();
        });

        renderizarServicios();
    </script>
</body>
</html>
